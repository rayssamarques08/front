<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecanica - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
    <main>
        <img src="img/825256778_1098230689735171_2268531817311226708_n.png" alt="Logo">
        <h1>Faça seu LOGIN</h1>
        <form>
            <div class="inputGroup"> <label for="username">Usuário:</label>
                <div class="input-item"><i class="fa-solid fa-envelope"></i>
                    <input id="username" type="text">
                </div>
            </div>
            <div class="inputGroup"><label for="password">Senha : </label>
                <div class="input-item"><i class="fa-solid fa-lock"></i> <input id="senha" type="password" />
                </div>
            </div>
            <button class="btn-login"><a href="telainicial.html">ENTRAR</a></button>
        </form>
    </main>
</body>

</html>
