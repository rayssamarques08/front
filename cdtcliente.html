<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" href="cdtcliente.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head>

<body>
    <header>
        <nav class="nav-menu">
            <ul class="lista-menu">
                <img src="img/825256778_1098230689735171_2268531817311226708_n.png" alt="Logo">

                <li><a href="telainicial.html">Menu</a></li>
                <li><a href="listacliente.html"> Listagem de Clientes</a></li>
                <li><a href="listaagendamento.html">Listagem de Agendamento </a></li>
                <li><a href="agendamento.html">Fazer Agendamento</a></li>
                <li><a href="cdtcliente.html"> Cadastrar Cliente</a></li>
                <li><a href="cdtveiculo.html"> Cadastrar Veículo</a></li>
            </ul>
            <div><img src="img/masculino-sombra-usuario_318-34042.avif" alt="imagem perfil" class="img-perfil"></div>
            <button class="btn-menu"><a href="index.html">Sair</a></button>
        </nav>
    </header>
    <main>

        <h1>CADASTRE SEU CLIENTE</h1>
        <form>
            <div class="inputGroup"> <label for="name">Nome:</label>
                <div class="input-item"><i class="fa-solid fa-user"></i>
                    <input id="name" type="text">
                </div>
            </div>
            <div class="inputGroup"><label for="phone">Telefone : </label>
                <div class="input-item"><i class="fa-solid fa-phone"></i> <input id="phone" type="text" />
                </div>
            </div>
            <div class="inputGroup"> <label for="email">Email:</label>
                <div class="input-item"><i class="fa-regular fa-envelope"></i>
                    <input id="email" type="text">
                </div>
            </div>
            <div class="inputGroup"> <label for="cpf">CPF:</label>
                <div class="input-item"><i class="fa-solid fa-folder"></i>
                    <input id="cpf" type="text">
                </div>
            </div>


            <button class="btn-cadastrocliente"><a href="listacliente.html">CADASTRE</a></button>
        </form>

    </main>

</body>

</html>
